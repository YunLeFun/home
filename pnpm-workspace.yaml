packages:
  - .

nodeVersion: 24.22.3
engineStrict: true
strictPeerDependencies: true
shellEmulator: true

overrides:
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  fast-uri@<3.1.9: ^3.1.9
  readdir-glob@3.0.0>minimatch: ^11.0.9
  tar@<=7.5.20: ^7.5.21
  vue: 3.5.46
  vue-router: 5.5.1

# The remaining advisory reaches Nuxt's build-time file matching through Nitro.
# Remove the exception once Nitro picks up a patched release.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3, deeply nested pattern DoS

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: false
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - tar@7.5.21
  - '@yunlefun/ui@0.0.7'

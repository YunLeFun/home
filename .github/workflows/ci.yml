name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Home Assistant module
        run: swift test
      - name: Test native device state and persistence
        run: swift test --package-path apps/macos
      - name: Build native app bundle
        run: bash apps/macos/scripts/bundle.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit:prod

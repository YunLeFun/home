name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  native-macos:
    runs-on: macos-15
    env:
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Home Assistant module
        run: swift test
      - name: Test native device state and persistence
        run: swift test --package-path apps/macos
      - name: Import Developer ID for main branch validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 apps/macos/scripts/ci-signing.py install
      - name: Build native app bundle
        run: bash apps/macos/scripts/bundle.sh
      - name: Verify Developer ID signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 apps/macos/scripts/ci-signing.py verify apps/macos/build/YunHome.app fun.yunle.home
      - name: Verify relocated app launch
        run: python3 apps/macos/scripts/verify-bundle.py
      - name: Remove temporary signing keychain
        if: always() && env.MACOS_SIGNING_DIR != ''
        run: python3 apps/macos/scripts/ci-signing.py cleanup

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit:prod

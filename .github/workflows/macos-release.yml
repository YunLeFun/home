name: macOS Release

# Push a macos-v<version> tag (matching apps/macos/VERSION) to publish the
# native app. The app's update check reads these releases and links to
# YunHome-<version>.zip. Builds are ad-hoc signed, not notarized.

on:
  push:
    tags:
      - 'macos-v*'

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          version=$(tr -d '[:space:]' < apps/macos/VERSION)
          if [ "macos-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::apps/macos/VERSION is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Test
        run: swift test --package-path apps/macos

      - name: Bundle
        run: bash apps/macos/scripts/bundle.sh

      - name: Verify relocated app launch
        run: python3 apps/macos/scripts/verify-bundle.py

      - name: Zip
        run: ditto -c -k --keepParent apps/macos/build/YunHome.app "YunHome-${GITHUB_REF_NAME#macos-v}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag "${notes[@]}" --title "云之彼端 macOS ${GITHUB_REF_NAME#macos-v}"
          gh release upload "$GITHUB_REF_NAME" --clobber "YunHome-${GITHUB_REF_NAME#macos-v}.zip"

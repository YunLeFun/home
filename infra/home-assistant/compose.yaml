name: yun-home-ha

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
    # Start this optional service explicitly instead of starting with Docker.
    restart: "no"
    stop_grace_period: 60s
    environment:
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${YUN_HOME_HA_DATA:?Run scripts/home-assistant.sh up first}
        target: /config
        bind:
          create_host_path: false
    # Colima runs Linux in a VM. Publish a loopback port for this Mac;
    # Linux host networking would not bridge macOS multicast discovery.
    ports:
      - "127.0.0.1:8123:8123"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
